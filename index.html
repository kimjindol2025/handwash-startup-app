<style>
:root{--ink:#102d3b;--teal:#168573;--mint:#eaf7f3;--paper:#f5f7f8;--line:#dbe3e7;--muted:#667780;--white:#fff;--gold:#e2ad51;--red:#b34a45}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#243943;font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,1fr)}aside{background:var(--ink);color:#e8f1f4;padding:24px 16px;display:flex;flex-direction:column;gap:14px}.brand{font-size:12px;font-weight:850;letter-spacing:.14em;color:#90ddcc}.brand b{display:block;font-size:20px;letter-spacing:0;color:white;margin-top:5px}.lead{font-size:12px;color:#b5c7cf;margin:0 8px 4px}.nav{display:grid;gap:5px;overflow:auto}.nav button{border:0;text-align:left;color:#ccdae0;background:transparent;padding:9px 11px;border-radius:9px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}.nav button:hover,.nav button.active{background:#1c4655;color:white}.nav .n{color:#7ed5c2;font-weight:800;min-width:22px}.aside-actions{margin-top:auto;display:grid;gap:8px}.aside-actions button{border:1px solid #46616d;border-radius:8px;background:transparent;color:white;padding:9px}.main{min-width:0;padding:26px clamp(16px,4vw,52px) 60px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}.eyebrow{font-size:10px;color:var(--teal);font-weight:850;letter-spacing:.15em}.top h1{font-size:clamp(22px,3vw,32px);line-height:1.25;color:var(--ink);margin:6px 0}.top p{margin:0;color:var(--muted);font-size:13px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button,.btn{border:0;border-radius:8px;background:var(--ink);color:white;padding:9px 13px;font-size:12px;font-weight:700}.tools button.secondary,.btn.secondary{color:var(--ink);background:#e6edef}.content{max-width:1000px}.intro{background:var(--mint);border:1px solid #cce8df;border-radius:12px;padding:16px 18px;margin-bottom:18px}.intro strong{color:#176c5f}.intro p{margin:4px 0 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:0 2px 7px #102d3b08}.card.wide{grid-column:1/-1}.card h2{font-size:16px;color:var(--ink);margin:0 0 9px}.card h3{font-size:13px;color:#35515e;margin:14px 0 6px}.card p{margin:5px 0 12px}.muted,.hint{color:var(--muted);font-size:12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:grid;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#405760}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd8dd;border-radius:7px;padding:9px 10px;background:white;color:#203741}.field textarea{min-height:78px;resize:vertical}.checklist{display:grid;gap:6px}.check{display:flex;gap:9px;align-items:flex-start;padding:8px 9px;border:1px solid #e3e9ec;border-radius:8px;background:#fbfcfc}.check input{margin-top:5px;accent-color:var(--teal)}.check span{font-size:13px}.check:has(input:checked){background:#f1f8f6;color:#59716f}.result{margin-top:12px;border-radius:9px;background:#f1f5f6;padding:12px}.result strong{display:block;color:var(--ink);font-size:18px}.result .good{color:#167563}.result .warn{color:#a56318}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:#526670;background:#f5f8f9;white-space:nowrap}td input{width:100%;min-width:90px;border:1px solid #d6e0e4;border-radius:6px;padding:7px}.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.smallbtn{border:1px solid var(--line);background:white;border-radius:7px;padding:6px 9px;font-size:11px;color:#2c4652}.progress{height:8px;border-radius:8px;background:#e4ebee;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}.footer{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);color:#75848a;font-size:11px}.empty{padding:18px;border:1px dashed #c5d2d7;border-radius:8px;color:#76858b;font-size:13px}.toast{position:fixed;bottom:18px;right:18px;background:#102d3b;color:#fff;border-radius:9px;padding:10px 15px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:780px){.shell{grid-template-columns:1fr}aside{padding:15px 12px 10px;gap:9px}.brand b{display:inline;margin-left:6px;font-size:16px}.lead{display:none}.nav{display:flex;overflow:auto;padding-bottom:4px}.nav button{min-width:145px;background:#ffffff0a}.aside-actions{display:flex;margin-top:0}.aside-actions button{flex:1;padding:7px}.main{padding:18px 14px 42px}.top{display:block}.tools{margin-top:12px}.grid{grid-template-columns:1fr}.card.wide{grid-column:auto}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>

<body>
<div class="shell"><aside><div class="brand">BIGWASH · WORKBOOK <b>손세차장 창업 준비 노트</b></div><p class="lead">책의 15개 단원을 내 사업의 기록으로 바꾸어 보세요.</p><nav class="nav" id="nav" aria-label="단원 메뉴"></nav><div class="aside-actions"><button id="export">내 기록 내려받기</button><button id="reset">기록 초기화</button></div></aside><main class="main"><header class="top"><div><div class="eyebrow">FIELD GUIDE · STARTUP WORKBOOK</div><h1 id="title">단원을 선택하세요</h1><p id="subtitle">입력한 내용은 이 브라우저에 저장됩니다.</p></div><div class="tools"><button class="secondary" id="print">인쇄</button></div></header><div class="content" id="content"></div><div class="footer">이 앱은 창업 판단을 돕는 기록 도구입니다. 인허가·건축·배수·폐수·세무·노무 사항은 관할 기관과 해당 전문가에게 확인하세요. 모든 숫자는 사용자가 입력한 가정값이며 사업 결과를 보장하지 않습니다.</div></main></div><div class="toast" id="toast"></div>
<script>
const chapters=[
{n:1,t:"창업은 문을 여는 일이고 운영은 살아남는 일이다",d:"개업은 시작입니다. 매출뿐 아니라 매일의 업무와 생활을 함께 생각합니다."},
{n:2,t:"내가 왜 세차장을 하려는가",d:"창업 동기와 원하는 생활을 구체적인 선택 기준으로 정리합니다."},
{n:3,t:"사업할 준비가 되어 있는가",d:"체력·시간·가족·경험·자금 준비 상태를 점검합니다."},
{n:4,t:"입지와 계약 전에 확인할 것",d:"후보지를 비교하고 계약 전 관할 부서 확인 항목을 기록합니다.",kind:"site"},
{n:5,t:"건물·배수·폐수·공사 조건",d:"건물 용도와 급배수·오수 처리·공사 조건을 확인합니다.",kind:"facility"},
{n:6,t:"창업비용과 견적서 읽기",d:"초기 투자금과 예비비, 운전자금을 직접 대입합니다.",kind:"startup"},
{n:7,t:"장비를 고르고 설치하는 기준",d:"장비별 용도·사양·설치 범위와 시운전 인수 기준을 비교합니다.",kind:"equipment"},
{n:8,t:"장비 고장과 관리",d:"점검·고장·수리 이력을 남기고 영업 중단 영향을 봅니다.",kind:"maintenance"},
{n:9,t:"서비스와 가격표 만들기",d:"작업 시간·인건비·소모품비로 서비스별 공헌이익을 계산합니다.",kind:"service"},
{n:10,t:"매출과 손익을 직접 계산하기",d:"고정비와 공헌이익률로 월 손익분기 매출을 계산합니다.",kind:"breakEven"},
{n:11,t:"예약·대기·작업 동선 운영",d:"예약과 대기 흐름을 기록하고 혼잡 지점을 찾습니다.",kind:"booking"},
{n:12,t:"고객 응대와 분쟁 처리",d:"재작업·환불·차량 손상 상황과 후속 조치를 기록합니다.",kind:"incident"},
{n:13,t:"직원과 역할을 나누는 운영",d:"업무 책임·권한·교육·검수 기준을 정리합니다.",kind:"roles"},
{n:14,t:"오픈 준비와 첫 달 운영",d:"시운전, 실제 작업시간, 고객 피드백과 수정 사항을 점검합니다.",kind:"opening"},
{n:15,t:"오래 운영하는 사업주가 점검할 것",d:"월간 지표와 현금 흐름, 장비 재투자 우선순위를 확인합니다.",kind:"cash"}
];
const state=JSON.parse(localStorage.getItem("bigwash-workbook-v1")||"{}");let active=1;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem("bigwash-workbook-v1",JSON.stringify(state));toast("브라우저에 저장했습니다.")}
function val(k){return state[k]??""}function put(k,v){state[k]=v;localStorage.setItem("bigwash-workbook-v1",JSON.stringify(state));}
function field(label,key,type="text",extra=""){return `<div class="field ${extra}"><label for="${key}">${label}</label><input id="${key}" data-key="${key}" type="${type}" value="${esc(val(key))}"></div>`}
function area(label,key,extra=""){return `<div class="field ${extra}"><label for="${key}">${label}</label><textarea id="${key}" data-key="${key}">${esc(val(key))}</textarea></div>`}
function checks(items,prefix){return `<div class="checklist">${items.map((x,i)=>{let k=`${prefix}_${i}`;return `<label class="check"><input type="checkbox" data-key="${k}" ${val(k)?"checked":""}><span>${x}</span></label>`}).join("")}</div>`}
function card(title,body,cls=""){return `<section class="card ${cls}"><h2>${title}</h2>${body}</section>`}
function result(label,id,value,sub=""){return `<div class="result"><span class="muted">${label}</span><strong id="${id}">${value}</strong>${sub?`<span class="muted">${sub}</span>`:""}</div>`}
function module(ch){let kind=ch.kind,html="";
 if(!kind) html=card("내 창업 메모",`<div class="fields">${area("이 단원에서 정리할 생각",`c${ch.n}_notes`)}${area("아직 확인하지 못한 질문",`c${ch.n}_questions`)}</div>`)+card("생각해 볼 질문",checks(["내가 원하는 생활과 실제 영업 조건을 비교했다","가족 또는 함께 일할 사람과 기대를 이야기했다","예상과 다른 상황이 생길 때 도움을 받을 곳을 생각했다"],`c${ch.n}_check`));
 if(kind==="site") html=card("후보지 기본 정보",`<div class="fields">${field("후보지 이름·주소","site_name")}${field("월 임대료(원)","site_rent","number")}${field("보증금(원)","site_deposit","number")}${field("차량 진입·출구 메모","site_access")}</div>`)+card("현장 점검",checks(["평일·주말 시간대를 나누어 차량 흐름을 관찰했다","진입·회차·대기 차량이 도로와 보행자에 미치는 영향을 봤다","작업 구역과 고객 대기 공간을 함께 그려봤다","임대차 계약 전 관할 부서에 용도와 영업 가능 조건을 확인했다","건축물 용도·불법 증축 여부를 확인할 담당 기관을 파악했다","배수·오수 처리와 필요한 시설 기준을 계약 전에 확인했다","구두 설명이 아니라 확인 담당자·날짜·답변을 기록했다"],"site_check"))+card("관할 부서 확인 기록",`<div class="fields">${field("부서·기관","site_agency")}${field("확인 날짜","site_date","date")}${area("질문과 답변 요약","site_answer","full")}${area("계약 전 남은 확인 사항","site_open","full")}</div>`);
 if(kind==="facility") html=card("건물과 설비 확인",checks(["건축물대장과 실제 현황의 차이를 확인했다","용도와 영업 가능 조건을 관할 부서에 문의했다","급수 용량·수압·계량기 위치를 확인했다","배수구 위치·구배·역류 가능성을 현장에서 확인했다","오수·폐수 처리 방식과 담당 부서를 확인했다","전기 용량과 장비별 전력 요구량을 확인했다","공사 범위·철거·원상복구 책임을 계약서에 적었다","공사 전후 사진과 변경 사항을 남길 계획이다"],"facility_check"))+card("질문·답변 메모",`<div class="fields">${field("확인 기관·담당자","facility_contact")}${field("확인 날짜","facility_date","date")}${area("확인 내용과 받은 답변","facility_answer","full")}</div>`);
 if(kind==="startup") html=card("초기 자금 직접 입력",`<div class="fields">${field("보증금","cost_deposit","number")}${field("권리금","cost_key","number")}${field("장비 구입","cost_equip","number")}${field("기반·설비 공사","cost_build","number")}${field("인허가·설계·용역","cost_service","number")}${field("간판·집기·초도 물품","cost_furnish","number")}${field("예비비","cost_reserve","number")}${field("운전자금","cost_working","number")}</div>${result("총 필요 자금","sumStart","0원","보증금부터 운영 초기 자금까지 합산합니다.")}`);
 if(kind==="equipment") html=card("장비 선택·설치 확인",checks(["작업량과 서비스 구성에 필요한 사양을 정했다","전기·급수·배수·설치 공간 조건을 확인했다","견적에 운반·설치·배관·전기 공사가 구분되어 있다","소모품과 정기 점검 비용을 확인했다","수리 대응 시간과 부품 공급 조건을 확인했다","설치 전후 사진과 장비 모델·제조번호를 남겼다","실제 차량을 이용해 시운전하고 이상을 확인했다","검수 기준과 하자 요청 기한을 문서로 남겼다"],"equipment_check"))+card("견적 비교 메모",`<div class="fields">${area("장비·업체 A: 장점과 조건","equip_a")}${area("장비·업체 B: 장점과 조건","equip_b")}${area("선택 이유와 미확인 사항","equip_decision","full")}</div>`);
 if(kind==="maintenance") html=card("장비 점검 기록",`<div class="fields">${field("점검일","maint_date","date")}${field("장비 이름·번호","maint_equip")}${field("증상·정상 상태와 달라진 점","maint_symptom")}${field("영업 중단 시간(분)","maint_downtime","number")}${area("초동 조치·안전 차단·업체 전달 내용","maint_action","full")}${field("수리비·부품비(원)","maint_cost","number")}</div><div class="row-actions"><button class="btn" id="addMaint">기록 추가</button></div><div id="maintRows"></div>`)+card("안전 기준",checks(["전기함·배선 수리는 전기 전문가에게 맡긴다","고압 배관의 압력이 남아 있을 수 있음을 알고 임의로 풀지 않는다","연기·스파크·타는 냄새·반복 차단 시 사용을 멈추고 주변을 통제한다","업체에 장비 모델·증상·발생 시각·사진·최근 수리 이력을 전달한다"],"maint_safe"));
 if(kind==="service") html=card("서비스 원가 계산",`<div class="fields">${field("서비스 이름","svc_name")}${field("판매 가격(원)","svc_price","number")}${field("작업자 수","svc_workers","number")}${field("1인당 투입 시간(분)","svc_minutes","number")}${field("시간당 인건비(원)","svc_wage","number")}${field("세제·소모품·세탁비(원)","svc_supply","number")}${field("결제 수수료 등 건별 비용(원)","svc_fee","number")}</div>${result("건당 변동비","svcVariable","0원")}${result("건당 공헌이익","svcContribution","0원","공헌이익으로 월 고정비를 부담합니다. 순이익과 다릅니다.")}${result("투입 인시 기준 시간당 공헌이익","svcHourly","0원")}`);
 if(kind==="breakEven") html=card("월 손익분기 계산",`<div class="fields">${field("월 고정비(원)","be_fixed","number")}${field("공헌이익률(%)","be_margin","number")}${field("월 영업일 수","be_days","number")}${field("하루 현실적 처리 대수","be_capacity","number")}</div>${result("월 손익분기 매출","be_month","0원")}${result("하루 손익분기 매출","be_day","0원")}${result("하루 평균 객단가 목표","be_ticket","0원","입력한 하루 처리 대수가 실제 가능 용량인지 확인하세요.")}`);

 if(kind==="opening") html=card("오픈 전 시운전",checks(["설치 업체 안내에 따라 전기·급수·배수와 장비 상태를 점검했다","실제 차량으로 접수부터 출고까지 전 과정을 연습했다","작업별 예상 시간과 실제 시간을 기록했다","직원·차량·고객 동선을 확인했다","가격·작업 범위·예상 시간 안내 문구를 준비했다","장비 업체와 긴급 연락처를 정리했다","첫 주 예약량을 실제 처리 능력에 맞췄다"],"opening_check"))+card("첫 달 작업 기록",`<div class="fields">${field("기록 날짜","open_date","date")}${field("하루 작업 차량 수","open_cars","number")}${field("평균 대기 시간(분)","open_wait","number")}${field("재작업·불만 건수","open_rework","number")}${area("오늘 발견한 문제와 조정할 내용","open_change","full")}</div>`);
 if(kind==="cash") html=card("월 운영 숫자",`<div class="fields">${field("월 매출(원)","cash_sales","number")}${field("월 변동비(원)","cash_variable","number")}${field("월 고정비(원)","cash_fixed","number")}${field("이번 달 통장 잔액(원)","cash_balance","number")}${field("향후 8~13주 예정 지출(원)","cash_future","number")}${field("수리·교체 검토 예산(원)","cash_reinvest","number")}</div>${result("입력값 기준 공헌이익","cash_contrib","0원")}${result("고정비 차감 후 남는 금액","cash_after","0원","세금·상환·사업주 보수 등은 별도 반영 여부를 확인하세요.")}`)+card("분기 점검표",checks(["서비스별 작업 건수와 공헌이익을 비교했다","실제 작업 시간과 예약 지연을 비교했다","재작업·환불·고객 불만의 반복 원인을 확인했다","장비 수리 이력과 영업 중단 시간을 검토했다","세금·상환·수선 지출이 예정된 시점을 확인했다","사업주가 현장을 비워도 운영되는지 확인했다","다음 분기에 바꿀 항목과 확인 지표를 하나 정했다"],"cash_quarter"))+card("다음 분기 개선 계획",`<div class="fields">${area("바꿔볼 한 가지","cash_plan")}${area("비용·담당자·확인 날짜·결과 지표","cash_measure")}</div>`);
 return `<div class="intro"><strong>${esc(ch.d)}</strong><p class="muted">작성 내용은 이 기기의 브라우저에 자동 저장됩니다.</p></div><div class="grid">${html}</div>`;

function render(n){active=n;const ch=chapters.find(x=>x.n===n);document.getElementById("title").textContent=`${String(n).padStart(2,"0")} · ${ch.t}`;document.getElementById("subtitle").textContent=ch.d;document.getElementById("content").innerHTML=module(ch);document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",+b.dataset.n===n));document.getElementById("content").querySelectorAll("[data-key]").forEach(el=>el.addEventListener("input",()=>{put(el.dataset.key,el.type==="checkbox"?el.checked:el.value);calculations()}));if(ch.kind==="maintenance")drawMaint();calculations();window.scrollTo({top:0,behavior:"smooth"})}
function won(x){return (Number(x)||0).toLocaleString("ko-KR")+"원"}function set(id,text){let e=document.getElementById(id);if(e)e.textContent=text}
function calculations(){let p=+val("svc_price"),w=+val("svc_workers"),m=+val("svc_minutes"),wage=+val("svc_wage"),sup=+val("svc_supply"),fee=+val("svc_fee"),labor=w*m/60*wage,variable=labor+sup+fee,contrib=p-variable;set("svcVariable",won(variable));set("svcContribution",won(contrib));set("svcHourly",won(m*w?contrib/(m*w/60):0));let fixed=+val("be_fixed"),margin=(+val("be_margin"))/100,days=+val("be_days"),cap=+val("be_capacity"),month=margin>0?fixed/margin:0,day=days?month/days:0;set("be_month",won(month));set("be_day",won(day));set("be_ticket",won(cap?day/cap:0));let start=["cost_deposit","cost_key","cost_equip","cost_build","cost_service","cost_furnish","cost_reserve","cost_working"].reduce((s,k)=>s+(+val(k)||0),0);set("sumStart",won(start));let c=+val("cash_sales")-(+val("cash_variable"));set("cash_contrib",won(c));set("cash_after",won(c-(+val("cash_fixed"))));}
function drawMaint(){let rows=Array.isArray(state.maint_rows)?state.maint_rows:[];let el=document.getElementById("maintRows");if(!el)return;el.innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>날짜</th><th>장비</th><th>증상</th><th>중단(분)</th><th>비용</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.equip)}</td><td>${esc(r.symptom)}</td><td>${esc(r.down)}</td><td>${esc(r.cost)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">아직 기록이 없습니다. 이상 증상과 조치를 남겨보세요.</div>`;let b=document.getElementById("addMaint");if(b)b.onclick=()=>{rows.push({date:val("maint_date"),equip:val("maint_equip"),symptom:val("maint_symptom"),down:val("maint_downtime"),cost:val("maint_cost"),action:val("maint_action")});state.maint_rows=rows;localStorage.setItem("bigwash-workbook-v1",JSON.stringify(state));drawMaint();toast("장비 기록을 추가했습니다.")}}
function toast(msg){let e=document.getElementById("toast");e.textContent=msg;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
chapters.forEach(c=>{let b=document.createElement("button");b.dataset.n=c.n;b.innerHTML=`<span class="n">${String(c.n).padStart(2,"0")}</span><span>${esc(c.t)}</span>`;b.onclick=()=>render(c.n);document.getElementById("nav").appendChild(b)});
document.getElementById("print").onclick=()=>window.print();document.getElementById("export").onclick=()=>{let blob=new Blob([JSON.stringify({app:"손세차장 창업 준비 노트",exportedAt:new Date().toISOString(),data:state},null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="손세차장-창업-기록.json";a.click();URL.revokeObjectURL(a.href)};document.getElementById("reset").onclick=()=>{if(confirm("이 브라우저에 저장된 모든 입력 기록을 지울까요?")){localStorage.removeItem("bigwash-workbook-v1");location.reload()}};render(1);
</script></body></html>
